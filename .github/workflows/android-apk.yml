name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'IshwarmoniKutir-Android-Project.zip'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip Android project
        run: |
          unzip -o IshwarmoniKutir-Android-Project.zip -d android-project
          find android-project -maxdepth 3 -type f | head -50

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: android-project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ishwarmoni-Kutir-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
